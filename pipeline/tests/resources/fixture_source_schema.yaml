sources:
  - name: test_app
    type: postgres
    tables:
      - name: test_log
        columns:
          - id
          - user_id
          - created_at
        primary_key: id
        load_mode: incremental_append
        incremental_key: id
        backfill_key: created_at

      - name: test_session
        columns:
          - id
          - user_id
          - status
          - started_at
          - ended_at
          - created_at
        primary_key: id
        load_mode: full