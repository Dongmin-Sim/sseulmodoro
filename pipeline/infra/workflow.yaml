main:
    params: [input]
    steps:
        - init:
            assign:
              - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
              - job_name: nsm-job
              - job_location: us-central1
              - job_path: ${"projects/" + project_id + "/locations/" + job_location + "/jobs/" + job_name}
              - target_tables: ${default(map.get(input, "tables"), null)}
        - require_tables:
            switch:
              - condition: ${target_tables == null}
                steps:
                  - no_tables:
                      raise: "tables is required: caller must pass the target table list"
        - run_ingestion:
            parallel:
              for:
                value: table
                in: ${target_tables}
                steps:
                  - run_table:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${job_path}
                        body:
                          overrides:
                            containerOverrides:
                              - args:
                                  - "run"
                                  - ${"--table=" + table}
        - run_transform:
            call: googleapis.run.v2.projects.locations.jobs.run
            args:
              name: ${job_path}
              body:
                overrides:
                  containerOverrides:
                    - args:
                        - "transform"
