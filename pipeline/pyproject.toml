[project]
name = "sseulmodoro-pipeline"
version = "0.1.0"
description = "쓸모도로 데이터 파이프라인"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "google-cloud-bigquery>=3.41.0",
    "pandas>=3.0.3",
    "pandas-gbq>=0.35.0",
    "psycopg[binary]>=3.3.3",
    "pyarrow>=24.0.0",
    "pyrefly>=1.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "supabase>=2.29.0",
]
[tool.pyrefly]
search-path = ["etl"]
python-version = "3.12"
project-excludes = ["etl/test/**"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["etl"]
addopts = "-v"

